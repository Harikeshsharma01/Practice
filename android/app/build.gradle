plugins { id 'com.android.application' }
def appRelease = new groovy.json.JsonSlurper().parse(file('../../shared/android-release.json'))
android {
    namespace 'com.sewestian.learning'
    compileSdk 36
    defaultConfig {
        applicationId 'com.sewestian.learning'
        minSdk 26
        targetSdk 36
        versionCode appRelease.versionCode
        versionName appRelease.version
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    buildTypes { release { minifyEnabled false } }
}

// First run npm run android:web from the repository root.
android.sourceSets.main.assets.srcDirs = ["../.build/assets"]
tasks.register("stageOfflineAssets", Copy) { from "../.build/web"; into "../.build/assets/www"; exclude "downloads/**" }
tasks.named("preBuild").configure { dependsOn "stageOfflineAssets" }
android.androidResources.noCompress += ["mp4", "webm", "mp3"]
